name: Android

# Builds the Android app and runs its unit tests. The Firebase settings come from repository
# secrets; without them the app still builds, and says on screen that it is not set up.
on:
  push:
    branches: [master, 'ci/**'] # ci/... branches are trial builds
    paths:
      - 'android/**'
      - 'shared/**'
      - 'scripts/android-shots.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build the debug app
        working-directory: android
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      - name: The app
        uses: actions/upload-artifact@v7
        with:
          name: roundabout-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  # Installs the app on an emulator, taps through it and takes screenshots. The emulator has no
  # on-device model, so this is the cloud path of the hybrid app.
  screens:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: roundabout-android-debug
          path: apk

      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # A plain Android image without Google's apps: lighter, so the slow CI machine keeps up.
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_7
          cores: 3
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb shell settings put global hide_error_dialogs 1
            adb install -r apk/app-debug.apk
            if [ -n "$APPCHECK_DEBUG_TOKEN" ]; then adb shell "run-as app.roundabout.words sh -c 'mkdir -p files && echo $APPCHECK_DEBUG_TOKEN > files/appcheck-debug-token'"; fi
            python3 scripts/android-shots.py android-shots
        env:
          # A debug token that is registered with App Check. It is handed to the app on the
          # emulator at run time and is never part of the app file.
          APPCHECK_DEBUG_TOKEN: ${{ secrets.APPCHECK_DEBUG_TOKEN }}

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-screenshots
          path: android-shots/
          if-no-files-found: ignore

